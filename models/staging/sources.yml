version: 2

sources:
  - name: staging
    database: postgres
    schema: staging
    tables:

      # ─────────────────────────────────────
      # Pune Project (pup01)
      # ─────────────────────────────────────
      - name: pp_raw_data
        loaded_at_field: submission_date
        freshness:
          warn_after: {count: 24, period: hour}
          error_after: {count: 48, period: hour}

      # ─────────────────────────────────────
      # Nadiad Project (hpn02)
      # ─────────────────────────────────────
      - name: athlete_registration
        loaded_at_field: submissiondate
        freshness:
          warn_after: {count: 24, period: hour}
          error_after: {count: 48, period: hour}

      - name: injury_report
        loaded_at_field: submissiondate
        freshness:
          warn_after: {count: 24, period: hour}
          error_after: {count: 48, period: hour}

      - name: competition_report
        loaded_at_field: submissiondate
        freshness:
          warn_after: {count: 24, period: hour}
          error_after: {count: 48, period: hour}

      # ─────────────────────────────────────
      # SFT Project (sft03)
      # ─────────────────────────────────────
      - name: Merged_P_S
      - name: Merged_A_S
      - name: Merged_P_C
      - name: Merged_A_C

      # ─────────────────────────────────────
      # Athlete Support Project (hpa04)
      # ─────────────────────────────────────
      - name: athlete_profile
        loaded_at_field: last_updated
        freshness:
          warn_after: {count: 7, period: day}
          error_after: {count: 14, period: day}

      - name: match_results
        loaded_at_field: last_updated
        freshness:
          warn_after: {count: 7, period: day}
          error_after: {count: 14, period: day}

      - name: rankings
        loaded_at_field: last_updated
        freshness:
          warn_after: {count: 7, period: day}
          error_after: {count: 14, period: day}

      - name: head_to_head
        loaded_at_field: last_updated
        freshness:
          warn_after: {count: 7, period: day}
          error_after: {count: 14, period: day}

      # ─────────────────────────────────────
      # Leadership Project (hpl07)
      # ─────────────────────────────────────
      - name: participant_registration
        loaded_at_field: submission_date
        freshness:
          warn_after: {count: 24, period: hour}
          error_after: {count: 48, period: hour}

      - name: session_feedback
        loaded_at_field: submission_date
        freshness:
          warn_after: {count: 24, period: hour}
          error_after: {count: 48, period: hour}

      - name: hpl07_zoom_attendance_participants
        loaded_at_field: session_date
        freshness:
          warn_after: {count: 7, period: day}
          error_after: {count: 14, period: day}

      - name: session_schedule
        loaded_at_field: session_date
        freshness:
          warn_after: {count: 7, period: day}
          error_after: {count: 14, period: day}

      - name: dimension_summary
        loaded_at_field: hplid
        freshness:
          warn_after: {count: 7, period: day}
          error_after: {count: 14, period: day}

      - name: hplids
        loaded_at_field: hplid
        freshness:
          warn_after: {count: 7, period: day}
          error_after: {count: 14, period: day}

      # ─────────────────────────────────────
      # BVL Project (bvl / hpb11)
      # ─────────────────────────────────────
      - name: Team_Name_List
        # no freshness check - this is a static team roster, not an
        # event-timestamped submission (same pattern as SFT's Merged_* tables)

      - name: Match_Schedule
        # no freshness check - fixtures are entered in advance, not
        # event-timestamped

      - name: data
        # BVL Scoring Submissions (SurveyCTO publish to Google Sheet).
        # Generic table name comes from the sheet tab. The staging model
        # filters on formdef_id = 'hpb11_bvl_match_scoring'.

      - name: Raw_Data_Population
        # DEPRECATED (Oct 2026): no longer used as a data source. Kept
        # declared only because the old stg_hpb11_bvl_matches model still
        # references it. Freshness check removed on purpose. Delete this
        # entry together with the old model once the dashboard and n8n
        # are switched to the new Match Schedule + Scoring marts.

models:
  # ─────────────────────────────────────
  # Pune (pup01)
  # ─────────────────────────────────────
  - name: stg_surveycto_visits
    columns:
      - name: submission_key
        tests:
          - not_null
          - unique
      - name: visit_date
        tests:
          - not_null

  # ─────────────────────────────────────
  # Nadiad (hpn02)
  # ─────────────────────────────────────
  - name: stg_nadiad_registration
    columns:
      - name: submission_key
        tests:
          - not_null
          - unique
      - name: athlete_id
        tests:
          - not_null

  - name: stg_nadiad_injury
    columns:
      - name: submission_key
        tests:
          - not_null
          - unique
      - name: athlete_id
        tests:
          - not_null

  - name: stg_nadiad_competition
    columns:
      - name: submission_key
        tests:
          - not_null
          - unique
      - name: athlete_id
        tests:
          - not_null

  # ─────────────────────────────────────
  # SFT (sft03)
  # ─────────────────────────────────────
  - name: stg_planned_school
    columns:
      - name: fellow_name
        tests:
          - not_null
      - name: planned_date
        tests:
          - not_null

  - name: stg_actual_school
    columns:
      - name: fellow_name
        tests:
          - not_null

  - name: stg_planned_community
    columns:
      - name: fellow_name
        tests:
          - not_null

  - name: stg_actual_community
    columns:
      - name: fellow_name
        tests:
          - not_null

  # ─────────────────────────────────────
  # Athlete Support (hpa04)
  # ─────────────────────────────────────
  - name: stg_hpa04_athlete_profile
    columns:
      - name: athlete_id
        tests:
          - not_null
          - unique

  - name: stg_hpa04_match_results
    columns:
      - name: match_id
        tests:
          - not_null
          - unique
      - name: athlete_id
        tests:
          - not_null

  - name: stg_hpa04_rankings
    columns:
      - name: ranking_id
        tests:
          - not_null
          - unique

  - name: stg_hpa04_head_to_head
    columns:
      - name: h2h_id
        tests:
          - not_null

  # ─────────────────────────────────────
  # Leadership Project (hpl07)
  # ─────────────────────────────────────
  - name: stg_hpl07_registration
    columns:
      - name: submission_key
        tests:
          - not_null
      - name: hplid
        tests:
          - not_null
          - unique

  # ─────────────────────────────────────
  # BVL Project (hpb11)
  # ─────────────────────────────────────
  - name: stg_hpb11_bvl_teams
    columns:
      - name: team_id
        tests:
          - not_null
          - unique
      - name: team_name
        tests:
          - not_null
      - name: age_category
        tests:
          - not_null
          - accepted_values:
              values: ['U-10', 'U-12', 'U-14', 'U-16', 'U-18']
      - name: gender_category
        tests:
          - not_null
          - accepted_values:
              values: ['Boys', 'Girls']
      - name: squad_display_name
        tests:
          - not_null
          - unique

  # NEW (Oct 2026): Match Schedule + Scoring Submissions architecture
  - name: stg_hpb11_bvl_match_schedule
    columns:
      - name: match_id
        tests:
          - not_null
          - unique
      - name: match_date
        tests:
          - not_null
      - name: team_a_squad
        tests:
          - not_null
      - name: team_b_squad
        tests:
          - not_null

  - name: stg_hpb11_bvl_scoring_submissions
    columns:
      - name: match_id
        tests:
          - not_null
          - unique

  - name: mart_hpb11_bvl_matches_v2
    columns:
      - name: match_id
        tests:
          - not_null
          - unique
      - name: home_team_id
        tests:
          - not_null
      - name: away_team_id
        tests:
          - not_null

  # OLD (Raw_Data_Population based) - to be removed after 6e switch-over
  - name: stg_hpb11_bvl_matches
    columns:
      - name: match_id
        tests:
          - not_null
          - unique
      - name: match_date
        tests:
          - not_null
      - name: home_team_name
        tests:
          - not_null
      - name: away_team_name
        tests:
          - not_null
      - name: status
        tests:
          - accepted_values:
              values: ['Scheduled', 'Completed']

  - name: mart_hpb11_bvl_matches
    columns:
      - name: match_id
        tests:
          - not_null
          - unique
      - name: home_team_id
        tests:
          - not_null
      - name: away_team_id
        tests:
          - not_null

  - name: mart_hpb11_bvl_standings
    columns:
      - name: team_id
        tests:
          - not_null
      - name: league_points
        tests:
          - not_null

  - name: mart_hpb11_bvl_team_summary
    columns:
      - name: team_id
        tests:
          - not_null
          - unique

  - name: mart_hpb11_bvl_standings_v2
    columns:
      - name: team_id
        tests:
          - not_null
      - name: league_points
        tests:
          - not_null

  - name: mart_hpb11_bvl_team_summary_v2
    columns:
      - name: team_id
        tests:
          - not_null
          - unique